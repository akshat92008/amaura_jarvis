[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "jarvis"
version = "5.5.0"
description = "Amaura JARVIS — general executive assistant and governed autonomous Company OS."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.0.0",
    "fastapi>=0.109.0",
    "httpx[socks]>=0.27.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.2.0",
    "markdown>=3.6",
    "numpy>=1.26.0,<2.5",
    "openai>=1.30.0",
    "opencv-python>=4.10.0",
    "Pillow>=10.0.0",
    "prompt-toolkit>=3.0.43",
    "pydantic>=2.0",
    "pygments>=2.17.0",
    "python-pptx>=0.6.23",
    "python-telegram-bot>=21.0",
    "rich>=13.7.0",
    "sqlalchemy>=2.0.0",
    "SpeechRecognition>=3.10.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
voice = ["PyAudio>=0.2.14"]
oss-browser = [
    "playwright>=1.50.0",
    "crawl4ai>=0.6.0",
    "browser-use>=0.4.0",
]
oss-documents = [
    "docling>=2.0.0",
    "PyMuPDF>=1.24.0",
    "paddleocr>=3.0.0",
]
oss-memory = [
    "llama-index-core>=0.12.0",
    "qdrant-client[fastembed]>=1.12.0",
]
oss-media = [
    "faster-whisper>=1.1.0",
    "kokoro>=0.9.4",
    "soundfile>=0.12.1",
    "yt-dlp[default]>=2025.1.0",
]
oss-observability = [
    "langfuse>=4.0.0",
    "mcp>=1.0.0",
]
dev = [
    "build>=1.2.2",
    "mypy>=1.11.0,<2.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "types-Markdown>=3.6.0",
]

[project.scripts]
arch = "jarvis.arch:main"
jarvis = "jarvis.reliable_cli:main"
nexus = "jarvis.cli:main"
amaura-worker = "jarvis.amaura.supervisor:main"
amaura-company = "jarvis.amaura.company_daemon:main"
amaura = "jarvis.amaura.cli:main"


[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
"jarvis.amaura.prompts" = ["*.md"]
"jarvis.amaura" = ["resources/*"]
"jarvis" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.ruff]
line-length = 120
target-version = "py311"
# These directories are executable evidence, generated builds, or retired
# prototypes rather than maintained application source.  Keeping them out of
# the default lint target makes `ruff check .` match the release surface.
extend-exclude = [
    "aimodel",
    "audit_package",
    "audit_script.py",
    "build",
    "desktop-app",
    "fixture",
    "qualification_evidence",
    "qualification_runs",
    "SuperMario.py",
    "test_master_script.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"jarvis/amaura/semantic_core.py" = ["F401"]
"jarvis/tools/registry.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
# Qualification artefacts intentionally contain disposable repositories and
# tests.  The maintained product suite lives exclusively under ``tests``;
# without this boundary a normal ``pytest`` invocation can collect stale,
# duplicate fixture modules and produce false release failures.
testpaths = ["tests"]
