<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .options {
            margin-bottom: 1rem;
        }
        .option {
            margin-bottom: 0.5rem;
        }
        label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        input[type="checkbox"] {
            margin-right: 0.5rem;
        }
        .slider-container {
            margin-bottom: 1rem;
        }
        .slider {
            width: 100%;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
        #password {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        .strength-indicator {
            height: 5px;
            background-color: #eee;
            margin-bottom: 1rem;
            border-radius: 2.5px;
            overflow: hidden;
        }
        .strength {
            height: 100%;
            width: 0;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>
        <div class="slider-container">
            <label for="length">Length: <span id="length-value">12</span></label>
            <input type="range" id="length" class="slider" min="8" max="32" value="12">
        </div>
        <div class="options">
            <div class="option">
                <label>
                    <input type="checkbox" id="uppercase" checked>
                    Include Uppercase Letters
                </label>
            </div>
            <div class="option">
                <label>
                    <input type="checkbox" id="lowercase" checked>
                    Include Lowercase Letters
                </label>
            </div>
            <div class="option">
                <label>
                    <input type="checkbox" id="numbers" checked>
                    Include Numbers
                </label>
            </div>
            <div class="option">
                <label>
                    <input type="checkbox" id="symbols">
                    Include Symbols
                </label>
            </div>
        </div>
        <button id="generate">Generate Password</button>
        <input type="text" id="password" readonly>
        <div class="strength-indicator">
            <div class="strength" id="strength"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lengthSlider = document.getElementById('length');
            const lengthValue = document.getElementById('length-value');
            const uppercaseCheckbox = document.getElementById('uppercase');
            const lowercaseCheckbox = document.getElementById('lowercase');
            const numbersCheckbox = document.getElementById('numbers');
            const symbolsCheckbox = document.getElementById('symbols');
            const generateButton = document.getElementById('generate');
            const passwordField = document.getElementById('password');
            const strengthIndicator = document.getElementById('strength');

            lengthSlider.addEventListener('input', function() {
                lengthValue.textContent = this.value;
            });

            generateButton.addEventListener('click', function() {
                const length = parseInt(lengthSlider.value);
                const includeUppercase = uppercaseCheckbox.checked;
                const includeLowercase = lowercaseCheckbox.checked;
                const includeNumbers = numbersCheckbox.checked;
                const includeSymbols = symbolsCheckbox.checked;

                const password = generatePassword(length, includeUppercase, includeLowercase, includeNumbers, includeSymbols);
                passwordField.value = password;
                updateStrengthIndicator(password);
            });

            function generatePassword(length, uppercase, lowercase, numbers, symbols) {
                let charset = '';
                if (uppercase) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                if (lowercase) charset += 'abcdefghijklmnopqrstuvwxyz';
                if (numbers) charset += '0123456789';
                if (symbols) charset += '!@#$%^&*()_+~`|}{[]\:;?><,./-=';

                let password = '';
                for (let i = 0; i < length; i++) {
                    const randomIndex = Math.floor(Math.random() * charset.length);
                    password += charset[randomIndex];
                }

                return password;
            }

            function updateStrengthIndicator(password) {
                const length = password.length;
                let strength = 0;

                // Length contributes to strength
                if (length >= 8) strength += 20;
                if (length >= 12) strength += 20;
                if (length >= 16) strength += 20;
                if (length >= 20) strength += 20;
                if (length >= 24) strength += 20;

                // Character variety contributes to strength
                const hasUppercase = /[A-Z]/.test(password);
                const hasLowercase = /[a-z]/.test(password);
                const hasNumbers = /[0-9]/.test(password);
                const hasSymbols = /[^A-Za-z0-9]/.test(password);

                if (hasUppercase) strength += 20;
                if (hasLowercase) strength += 20;
                if (hasNumbers) strength += 20;
                if (hasSymbols) strength += 20;

                // Cap the strength at 100
                strength = Math.min(strength, 100);

                // Update the strength indicator
                strengthIndicator.style.width = strength + '%';

                // Change color based on strength
                if (strength < 40) {
                    strengthIndicator.style.backgroundColor = '#ff4444';
                } else if (strength < 70) {
                    strengthIndicator.style.backgroundColor = '#ffbb33';
                } else {
                    strengthIndicator.style.backgroundColor = '#00C851';
                }
            }
        });
    </script>
</body>
</html>
