<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .palette-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .color-swatch {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            font-weight: bold;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Color Palette Generator</h1>
    <div class="palette-container" id="palette">
        <!-- Color swatches will be inserted here by JavaScript -->
    </div>
    <button id="generate-btn">Generate New Palette</button>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            generatePalette();
            
            document.getElementById('generate-btn').addEventListener('click', generatePalette);
        });
        
        function generatePalette() {
            const paletteContainer = document.getElementById('palette');
            paletteContainer.innerHTML = '';
            
            for (let i = 0; i < 5; i++) {
                const color = getRandomColor();
                
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = color;
                swatch.innerHTML = `<span>${color}</span>`;
                
                paletteContainer.appendChild(swatch);
            }
        }
        
        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }
    </script>
</body>
</html>
