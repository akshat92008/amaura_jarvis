<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fixture</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { color: var(--accent); font-size: 1.8rem; margin-bottom: 0.5rem; }
        p { color: var(--muted); line-height: 1.5; }
        .form-group { display: flex; gap: 0.5rem; margin: 1.5rem 0; }
        input {
            flex: 1;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: #0f172a;
            color: #fff;
        }
        button {
            padding: 0.75rem 1.25rem;
            background: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        ul { list-style: none; padding: 0; }
        li {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 fixture</h1>
        <p>fixture</p>
        
        <div class="form-group">
            <input type="text" id="itemInput" placeholder="Add a new item..." />
            <button onclick="addItem()">Add Item</button>
        </div>

        <ul id="itemList"></ul>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api';

        async function fetchItems() {
            try {
                const res = await fetch(`${API_URL}/items`);
                const items = await res.json();
                const list = document.getElementById('itemList');
                list.innerHTML = items.map(item => `<li><span>${item.title}</span> <small>${item.status}</small></li>`).join('');
            } catch (err) {
                console.error('API Error:', err);
            }
        }

        async function addItem() {
            const input = document.getElementById('itemInput');
            if (!input.value.trim()) return;
            try {
                await fetch(`${API_URL}/items`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: input.value.trim() })
                });
                input.value = '';
                fetchItems();
            } catch (err) {
                console.error('Error adding item:', err);
            }
        }

        fetchItems();
    </script>
</body>
</html>
