name: phase9r-review-var-fix
on:
  push:
    branches: [agent/phase9-semantic-repair]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/phase9-semantic-repair
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fix missed reviewer variable and verify
        run: |
          cd Amaura-JARVIS-v5.4
          python - <<'PY'
          from pathlib import Path
          p = Path('jarvis/amaura/executor.py')
          text = p.read_text()
          old = 'task_id, actor=reviewer_id, approve=approve, findings=findings.strip(), attestation=attestation'
          new = 'task_id, actor=reviewer_id, approve=review_approve, findings=review_findings.strip(), attestation=attestation'
          if old not in text:
              raise SystemExit('review_task variable anchor missing')
          p.write_text(text.replace(old, new, 1))
          PY
          python -m pip install --upgrade pip uv
          uv sync --frozen --extra dev --python python
          .venv/bin/ruff format jarvis/amaura/executor.py
          .venv/bin/ruff check jarvis scripts tests
          .venv/bin/python -m compileall -q jarvis aimodel scripts tests
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 .venv/bin/python -m pytest -q tests/test_amaura_supervisor.py::test_cloud_reviewer_uses_distinct_nvidia_model
          .venv/bin/mypy jarvis/amaura jarvis/tools/amaura.py jarvis/server.py
          cd ..
          rm .github/workflows/phase9r-review-var-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(phase9r): use narrowed reviewer decision values"
          git push origin HEAD:agent/phase9-semantic-repair
