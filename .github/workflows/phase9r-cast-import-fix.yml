name: phase9r-cast-import-fix
on:
  push:
    branches: [agent/phase9-semantic-repair]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/phase9-semantic-repair
      - name: Add cast import and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Amaura-JARVIS-v5.4/jarvis/amaura/antigravity_bridge.py')
          text = p.read_text()
          if 'from typing import Any, ClassVar' in text:
              text = text.replace('from typing import Any, ClassVar', 'from typing import Any, ClassVar, cast', 1)
          elif 'from typing import Any' in text and 'cast' not in text.split('\n', 30):
              text = text.replace('from typing import Any', 'from typing import Any, cast', 1)
          p.write_text(text)
          PY
          rm .github/workflows/phase9r-cast-import-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(phase9r): import cast for antigravity settings"
          git push origin HEAD:agent/phase9-semantic-repair
