name: v10-qualification

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase9-semantic-repair
    paths:
      - 'Amaura-JARVIS-v5.4/scripts/arch_holdout_v10.py'
      - 'Amaura-JARVIS-v5.4/scripts/run_v10_qualification.sh'
      - '.github/workflows/v10-qualification.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: Amaura-JARVIS-v5.4

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AMAURA_MODEL_MODE: local
      AMAURA_LOCAL_MODEL: nova-worker-test
      AMAURA_LOCAL_REVIEW_MODEL: nova-reviewer-test
      AMAURA_REVIEWER_KEYS: qa-reviewer:ci-reviewer-key-at-least-thirty-two-bytes
      AMAURA_REVIEW_ATTESTATION_KEY: ci-review-attestation-key-at-least-thirty-two-bytes
      AMAURA_PROVIDER_RECEIPT_KEY: ci-provider-receipt-key-at-least-thirty-two-bytes
      AMAURA_AUDIT_HMAC_KEY: ci-audit-hmac-key-at-least-thirty-two-bytes
      AMAURA_EVIDENCE_HMAC_KEY: ci-evidence-hmac-key-at-least-thirty-two-bytes
      AMAURA_SANDBOX_MODE: docker
      AMAURA_DISABLE_CLOUD: '1'
      JARVIS_LEGACY_TOOL_MODE: disabled
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install frozen environment
        run: |
          python -m pip install --upgrade pip uv
          PYTHONWARNINGS=default uv sync --frozen --extra dev --python python
      - name: Compile V10 harness
        run: .venv/bin/python -m py_compile scripts/arch_holdout_v10.py
      - name: Run fresh V10 qualification
        id: v10
        continue-on-error: true
        run: |
          set -o pipefail
          .venv/bin/python scripts/arch_holdout_v10.py | tee v10-qualification.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > v10-exit.txt
          exit "$rc"
      - name: Upload V10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-qualification-evidence
          path: |
            Amaura-JARVIS-v5.4/v10-qualification.log
            Amaura-JARVIS-v5.4/v10-exit.txt
            Amaura-JARVIS-v5.4/qualification_evidence/**
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce V10 result
        if: always()
        run: |
          if [ ! -f v10-exit.txt ]; then
            echo 'V10 did not produce an exit code.'
            exit 1
          fi
          exit "$(cat v10-exit.txt)"
