name: patch-sqlite-test-contract

on:
  push:
    branches:
      - fix/bounded-cloud-turns

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/bounded-cloud-turns
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Update SQLite timeout regression contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Amaura-JARVIS-v5.4/tests/test_amaura_p0_fixes.py')
          text = path.read_text()
          old = '        assert timeout == 5000, f"Expected busy_timeout=5000, got {timeout}"\n'
          new = '        assert timeout == 30000, f"Expected busy_timeout=30000, got {timeout}"\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('busy timeout assertion anchor not found')
          path.write_text(text)
          PY
      - name: Run focused regression
        working-directory: Amaura-JARVIS-v5.4
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_amaura_p0_fixes.py::TestProgrammeAtomicity::test_sqlite_busy_timeout_set tests/test_sqlite_contention_budget.py
      - name: Commit test contract
        run: |
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Amaura-JARVIS-v5.4/tests/test_amaura_p0_fixes.py
          git commit -m 'test(store): align busy timeout contract with hardened default'
          git push origin HEAD:fix/bounded-cloud-turns
