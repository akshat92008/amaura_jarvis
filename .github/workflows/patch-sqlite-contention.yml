name: patch-sqlite-contention

on:
  push:
    branches:
      - fix/bounded-cloud-turns

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/bounded-cloud-turns
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Harden SQLite contention handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Amaura-JARVIS-v5.4/jarvis/amaura/store.py')
          text = path.read_text()

          old_connect = '''        self._lock = threading.RLock()\n        self._connection = sqlite3.connect(self.db_path, check_same_thread=False)\n        self._connection.row_factory = sqlite3.Row\n        self._connection.execute("PRAGMA foreign_keys = ON")\n        self._connection.execute("PRAGMA journal_mode = WAL")\n        self._connection.execute("PRAGMA busy_timeout = 5000")\n'''
          new_connect = '''        self._lock = threading.RLock()\n        try:\n            busy_timeout_ms = int(os.environ.get("AMAURA_SQLITE_BUSY_TIMEOUT_MS", "30000"))\n        except ValueError:\n            busy_timeout_ms = 30000\n        busy_timeout_ms = max(1_000, min(busy_timeout_ms, 120_000))\n        self._sqlite_busy_timeout_ms = busy_timeout_ms\n        self._connection = sqlite3.connect(\n            self.db_path,\n            check_same_thread=False,\n            timeout=busy_timeout_ms / 1000.0,\n        )\n        self._connection.row_factory = sqlite3.Row\n        self._connection.execute("PRAGMA foreign_keys = ON")\n        self._connection.execute("PRAGMA journal_mode = WAL")\n        self._connection.execute(f"PRAGMA busy_timeout = {busy_timeout_ms}")\n'''
          if old_connect in text:
              text = text.replace(old_connect, new_connect, 1)
          elif new_connect not in text:
              raise SystemExit('SQLite connection block anchor not found')

          path.write_text(text)

          test = Path('Amaura-JARVIS-v5.4/tests/test_sqlite_contention_budget.py')
          test.write_text('''from __future__ import annotations\n\nfrom jarvis.amaura.store import CompanyStore\n\n\ndef test_company_store_uses_production_busy_timeout_by_default(tmp_path, monkeypatch):\n    monkeypatch.delenv("AMAURA_SQLITE_BUSY_TIMEOUT_MS", raising=False)\n    with CompanyStore(tmp_path / "company.db") as store:\n        assert store._sqlite_busy_timeout_ms == 30_000\n        assert store._connection.execute("PRAGMA busy_timeout").fetchone()[0] == 30_000\n\n\ndef test_company_store_busy_timeout_is_configurable_and_bounded(tmp_path, monkeypatch):\n    monkeypatch.setenv("AMAURA_SQLITE_BUSY_TIMEOUT_MS", "2500")\n    with CompanyStore(tmp_path / "company.db") as store:\n        assert store._sqlite_busy_timeout_ms == 2_500\n        assert store._connection.execute("PRAGMA busy_timeout").fetchone()[0] == 2_500\n\n    monkeypatch.setenv("AMAURA_SQLITE_BUSY_TIMEOUT_MS", "999999")\n    with CompanyStore(tmp_path / "bounded.db") as store:\n        assert store._sqlite_busy_timeout_ms == 120_000\n        assert store._connection.execute("PRAGMA busy_timeout").fetchone()[0] == 120_000\n\n\ndef test_company_store_invalid_busy_timeout_falls_back_safely(tmp_path, monkeypatch):\n    monkeypatch.setenv("AMAURA_SQLITE_BUSY_TIMEOUT_MS", "not-an-int")\n    with CompanyStore(tmp_path / "company.db") as store:\n        assert store._sqlite_busy_timeout_ms == 30_000\n        assert store._connection.execute("PRAGMA busy_timeout").fetchone()[0] == 30_000\n''')
          PY
      - name: Run focused contention qualification
        working-directory: Amaura-JARVIS-v5.4
        env:
          AMAURA_AUDIT_HMAC_KEY: ci-audit-hmac-key-at-least-thirty-two-bytes
          AMAURA_EVIDENCE_HMAC_KEY: ci-evidence-hmac-key-at-least-thirty-two-bytes
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_sqlite_contention_budget.py
          python scripts/stress_trust_foundation.py
          python -m py_compile jarvis/amaura/store.py
      - name: Commit production patch
        run: |
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Amaura-JARVIS-v5.4/jarvis/amaura/store.py Amaura-JARVIS-v5.4/tests/test_sqlite_contention_budget.py
          git commit -m 'fix(store): tolerate bounded SQLite write contention'
          git push origin HEAD:fix/bounded-cloud-turns
