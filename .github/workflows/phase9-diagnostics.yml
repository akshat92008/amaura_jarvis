name: phase9-diagnostics

on:
  pull_request:
    paths:
      - 'Amaura-JARVIS-v5.4/jarvis/amaura/**'
      - 'Amaura-JARVIS-v5.4/tests/test_phase8_semantic_composition.py'
      - 'Amaura-JARVIS-v5.4/tests/test_phase9_*.py'
      - '.github/workflows/phase9-diagnostics.yml'
  push:
    branches:
      - agent/phase9-semantic-repair

permissions:
  contents: read

defaults:
  run:
    working-directory: Amaura-JARVIS-v5.4

jobs:
  semantic-diagnostics:
    runs-on: ubuntu-latest
    env:
      AMAURA_MODEL_MODE: local
      AMAURA_LOCAL_MODEL: nova-worker-test
      AMAURA_LOCAL_REVIEW_MODEL: nova-reviewer-test
      AMAURA_REVIEWER_KEYS: qa-reviewer:ci-reviewer-key-at-least-thirty-two-bytes
      AMAURA_REVIEW_ATTESTATION_KEY: ci-review-attestation-key-at-least-thirty-two-bytes
      AMAURA_PROVIDER_RECEIPT_KEY: ci-provider-receipt-key-at-least-thirty-two-bytes
      AMAURA_AUDIT_HMAC_KEY: ci-audit-hmac-key-at-least-thirty-two-bytes
      AMAURA_EVIDENCE_HMAC_KEY: ci-evidence-hmac-key-at-least-thirty-two-bytes
      AMAURA_SANDBOX_MODE: docker
      AMAURA_DISABLE_CLOUD: '1'
      JARVIS_LEGACY_TOOL_MODE: disabled
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install frozen environment
        run: |
          python -m pip install --upgrade pip uv
          PYTHONWARNINGS=default uv sync --frozen --extra dev --python python
      - name: Run semantic contract tests
        id: semantic
        continue-on-error: true
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -p anyio.pytest_plugin -vv --tb=short \
            tests/test_phase8_semantic_composition.py \
            tests/test_phase9_semantic_request_graph.py \
            > phase9-diagnostics.txt 2>&1 || echo $? > phase9-exit-code.txt
          cat phase9-diagnostics.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-semantic-diagnostics
          path: |
            Amaura-JARVIS-v5.4/phase9-diagnostics.txt
            Amaura-JARVIS-v5.4/phase9-exit-code.txt
          if-no-files-found: warn
          retention-days: 1
      - name: Enforce semantic result
        run: |
          if [ -f phase9-exit-code.txt ]; then
            exit "$(cat phase9-exit-code.txt)"
          fi
