name: phase9-diagnostics

on:
  push:
    branches:
      - agent/phase9-semantic-repair

permissions:
  contents: read

defaults:
  run:
    working-directory: Amaura-JARVIS-v5.4

jobs:
  full-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      AMAURA_MODEL_MODE: local
      AMAURA_LOCAL_MODEL: nova-worker-test
      AMAURA_LOCAL_REVIEW_MODEL: nova-reviewer-test
      AMAURA_REVIEWER_KEYS: qa-reviewer:ci-reviewer-key-at-least-thirty-two-bytes
      AMAURA_REVIEW_ATTESTATION_KEY: ci-review-attestation-key-at-least-thirty-two-bytes
      AMAURA_PROVIDER_RECEIPT_KEY: ci-provider-receipt-key-at-least-thirty-two-bytes
      AMAURA_AUDIT_HMAC_KEY: ci-audit-hmac-key-at-least-thirty-two-bytes
      AMAURA_EVIDENCE_HMAC_KEY: ci-evidence-hmac-key-at-least-thirty-two-bytes
      AMAURA_SANDBOX_MODE: docker
      AMAURA_DISABLE_CLOUD: '1'
      JARVIS_LEGACY_TOOL_MODE: disabled
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install frozen environment
        run: |
          python -m pip install --upgrade pip uv
          PYTHONWARNINGS=default uv sync --frozen --extra dev --python python
      - name: Compile all Python sources
        run: .venv/bin/python -m compileall -q jarvis aimodel scripts tests
      - name: Run maintained regression shards
        id: regression
        continue-on-error: true
        run: |
          set -o pipefail
          PYTHONWARNINGS=error .venv/bin/python scripts/run_verified_tests.py --timeout 300 \
            > full-regression-${{ matrix.python-version }}.txt 2>&1 || echo $? > full-regression-exit-${{ matrix.python-version }}.txt
          cat full-regression-${{ matrix.python-version }}.txt
          if [ -f full-regression-exit-${{ matrix.python-version }}.txt ]; then
            exit "$(cat full-regression-exit-${{ matrix.python-version }}.txt)"
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-${{ matrix.python-version }}
          path: |
            Amaura-JARVIS-v5.4/full-regression-${{ matrix.python-version }}.txt
            Amaura-JARVIS-v5.4/full-regression-exit-${{ matrix.python-version }}.txt
          if-no-files-found: warn
          retention-days: 1
      - name: Enforce regression result
        if: always()
        run: |
          if [ -f full-regression-exit-${{ matrix.python-version }}.txt ]; then
            exit "$(cat full-regression-exit-${{ matrix.python-version }}.txt)"
          fi
