name: phase9-diagnostics

on:
  push:
    branches:
      - agent/phase9-semantic-repair
    paths:
      - 'Amaura-JARVIS-v5.4/scripts/phase9_compat_repair.patch'
      - 'Amaura-JARVIS-v5.4/scripts/phase9_compat_v2.patch'
      - 'Amaura-JARVIS-v5.4/scripts/phase9_compat_v3.patch'
      - 'Amaura-JARVIS-v5.4/scripts/phase9_compat_v4.patch'
      - 'Amaura-JARVIS-v5.4/scripts/phase9_compat_v5.patch'
      - '.github/workflows/phase9-diagnostics.yml'
      - 'Amaura-JARVIS-v5.4/jarvis/**'

permissions:
  contents: write

defaults:
  run:
    working-directory: Amaura-JARVIS-v5.4

jobs:
  compatibility-repair:
    runs-on: ubuntu-latest
    env:
      AMAURA_MODEL_MODE: local
      AMAURA_LOCAL_MODEL: nova-worker-test
      AMAURA_LOCAL_REVIEW_MODEL: nova-reviewer-test
      AMAURA_REVIEWER_KEYS: qa-reviewer:ci-reviewer-key-at-least-thirty-two-bytes
      AMAURA_REVIEW_ATTESTATION_KEY: ci-review-attestation-key-at-least-thirty-two-bytes
      AMAURA_PROVIDER_RECEIPT_KEY: ci-provider-receipt-key-at-least-thirty-two-bytes
      AMAURA_AUDIT_HMAC_KEY: ci-audit-hmac-key-at-least-thirty-two-bytes
      AMAURA_EVIDENCE_HMAC_KEY: ci-evidence-hmac-key-at-least-thirty-two-bytes
      AMAURA_SANDBOX_MODE: docker
      AMAURA_DISABLE_CLOUD: '1'
      JARVIS_LEGACY_TOOL_MODE: disabled
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          ref: agent/phase9-semantic-repair
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply staged compatibility repairs
        run: |
          git apply --recount --reject scripts/phase9_compat_repair.patch || true
          python - <<'PY'
          from pathlib import Path
          p = Path('jarvis/amaura/semantic_frontend.py')
          s = p.read_text()
          old = '''    def exact_parse(cls: Any, text: str, workspace: str = "") -> Any:\n        graph = core.SemanticParser.parse(text, da.RequestPreprocessor.KNOWN_EXTENSIONS)\n        return _public_exact(graph) if graph.action == core.SemanticAction.EXACT_LITERAL else None\n\n    da.DirectActionRouter.can_handle = classmethod(can_handle)\n    da.DirectActionRouter.execute = classmethod(execute)\n    da.ExactResponseParser.parse = classmethod(exact_parse)\n'''
          new = '''    def exact_parse(cls: Any, text: str, workspace: str = "") -> Any:\n        graph = core.SemanticParser.parse(text, da.RequestPreprocessor.KNOWN_EXTENSIONS)\n        if graph.action != core.SemanticAction.EXACT_LITERAL:\n            return None\n        result = _public_exact(graph)\n        result.execution_type = "semantic_graph"\n        return result\n\n    def exact_parse_intent(cls: Any, text: str) -> Any:\n        graph = core.SemanticParser.parse(text, da.RequestPreprocessor.KNOWN_EXTENSIONS)\n        if graph.action != core.SemanticAction.EXACT_LITERAL or graph.literal_payload is None:\n            return None\n        payload = graph.literal_payload\n        candidates = list(re.finditer(re.escape(payload), text))\n        if not candidates:\n            return None\n        match = candidates[-1]\n        start, end = match.start(), match.end()\n        quote_style = "none"\n        if start > 0 and end < len(text) and text[start - 1] == text[end] and text[start - 1] in "'\\\"`":\n            quote_style = {"'": "single", '\\"': "double", "`": "backtick"}[text[start - 1]]\n        return da.ExactLiteralIntent(payload=payload, payload_span_start=start, payload_span_end=end, quote_style=quote_style, prefix_constraint=text[:start], suffix_constraint=text[end:], confidence=1.0)\n\n    da.DirectActionRouter.can_handle = classmethod(can_handle)\n    da.DirectActionRouter.execute = classmethod(execute)\n    da.ExactResponseParser.parse = classmethod(exact_parse)\n    da.ExactResponseParser.parse_intent = classmethod(exact_parse_intent)\n'''
          if old not in s:
              raise SystemExit('exact parser tail did not match expected canonical source')
          p.write_text(s.replace(old, new, 1))
          PY
          rejects=$(find . -name '*.rej' -print)
          if [ -n "$rejects" ]; then
            count=$(find . -name '*.rej' | wc -l)
            [ "$count" -eq 1 ] || { for f in $rejects; do cat "$f"; done; exit 2; }
            grep -q 'def exact_parse' $rejects || { for f in $rejects; do cat "$f"; done; exit 2; }
            find . -name '*.rej' -delete
          fi
          git apply --check scripts/phase9_compat_v2.patch
          git apply scripts/phase9_compat_v2.patch
          git apply --check scripts/phase9_compat_v3.patch
          git apply scripts/phase9_compat_v3.patch
          git apply --check scripts/phase9_compat_v4.patch
          git apply scripts/phase9_compat_v4.patch
          git apply --check scripts/phase9_compat_v5.patch
          git apply scripts/phase9_compat_v5.patch
          python -m py_compile jarvis/amaura/semantic_frontend.py jarvis/amaura/direct_action.py jarvis/agent.py
      - name: Install frozen environment
        run: |
          python -m pip install --upgrade pip uv
          PYTHONWARNINGS=default uv sync --frozen --extra dev --python python
      - name: Run affected regression families
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          .venv/bin/python -m pytest -p anyio.pytest_plugin -q --tb=short \
            tests/test_generic_execution_repair.py \
            tests/test_intent_routing.py \
            tests/test_phase4_execution_semantics.py \
            tests/test_phase5_2_grammar_closure.py \
            tests/test_phase5_writes_and_failure_injection.py \
            tests/test_phase6_arch_repairs.py \
            tests/test_phase7_exact_response_property.py \
            tests/test_phase7_failure_injection.py \
            tests/test_phase7_invariants_and_regression.py \
            tests/test_phase8_semantic_composition.py \
            tests/test_phase9_compatibility_gate.py \
            tests/test_phase9_semantic_hardening.py \
            tests/test_phase9_semantic_request_graph.py \
            > compatibility-diagnostics.txt 2>&1 || echo $? > compatibility-exit.txt
          cat compatibility-diagnostics.txt
          if [ -f compatibility-exit.txt ]; then exit "$(cat compatibility-exit.txt)"; fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-compatibility-final-diagnostics
          path: |
            Amaura-JARVIS-v5.4/compatibility-diagnostics.txt
            Amaura-JARVIS-v5.4/compatibility-exit.txt
            Amaura-JARVIS-v5.4/jarvis/amaura/semantic_frontend.py
            Amaura-JARVIS-v5.4/jarvis/amaura/direct_action.py
            Amaura-JARVIS-v5.4/jarvis/agent.py
          if-no-files-found: warn
          retention-days: 1
      - name: Commit verified compatibility repair
        if: steps.tests.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add jarvis/amaura/semantic_frontend.py jarvis/amaura/direct_action.py jarvis/agent.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: close semantic compatibility regressions'
            git push origin HEAD:agent/phase9-semantic-repair
          fi
      - name: Enforce result
        if: always()
        run: |
          if [ -f compatibility-exit.txt ]; then exit "$(cat compatibility-exit.txt)"; fi
