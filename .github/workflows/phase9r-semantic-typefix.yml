name: phase9r-semantic-typefix
on:
  push:
    branches: [agent/phase9-semantic-repair]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/phase9-semantic-repair
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fix semantic dynamic descriptor typing
        run: |
          cd Amaura-JARVIS-v5.4
          python - <<'PY'
          from pathlib import Path
          import re
          for p in sorted(Path('jarvis/amaura').glob('semantic*.py')):
              text = p.read_text()
              if '"__func__"' not in text:
                  continue
              if 'from typing import Any' not in text:
                  if 'from typing import ' in text:
                      text = re.sub(r'from typing import ([^\n]+)', lambda m: 'from typing import Any, ' + m.group(1), text, count=1)
                  else:
                      marker = 'from __future__ import annotations\n'
                      text = text.replace(marker, marker + '\nfrom typing import Any\n', 1)
              if 'def _unwrap_classmethod(value: Any) -> Any:' not in text:
                  marker = '_INSTALLED = False\n'
                  if marker not in text:
                      raise SystemExit(f'marker missing: {p}')
                  text = text.replace(marker, marker + '\n\ndef _unwrap_classmethod(value: Any) -> Any:\n    return getattr(value, "__func__", value)\n', 1)
              text = re.sub(r'getattr\(([^\n,]+(?:\.[A-Za-z_]\w*)+), "__func__", \1\)', r'_unwrap_classmethod(\1)', text)
              p.write_text(text)
          PY
          python -m pip install --upgrade pip uv
          uv sync --frozen --extra dev --python python
          .venv/bin/ruff format jarvis/amaura/semantic_*.py
          .venv/bin/ruff check jarvis scripts tests
          .venv/bin/python -m compileall -q jarvis
          .venv/bin/mypy jarvis/amaura jarvis/tools/amaura.py jarvis/server.py || true
          cd ..
          rm .github/workflows/phase9r-semantic-typefix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(phase9r): type dynamic semantic wrappers"
          git push origin HEAD:agent/phase9-semantic-repair
