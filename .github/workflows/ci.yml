name: release-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: Amaura-JARVIS-v5.4

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      AMAURA_MODEL_MODE: local
      AMAURA_LOCAL_MODEL: nova-worker-test
      AMAURA_LOCAL_REVIEW_MODEL: nova-reviewer-test
      AMAURA_REVIEWER_KEYS: qa-reviewer:ci-reviewer-key-at-least-thirty-two-bytes
      AMAURA_REVIEW_ATTESTATION_KEY: ci-review-attestation-key-at-least-thirty-two-bytes
      AMAURA_PROVIDER_RECEIPT_KEY: ci-provider-receipt-key-at-least-thirty-two-bytes
      AMAURA_AUDIT_HMAC_KEY: ci-audit-hmac-key-at-least-thirty-two-bytes
      AMAURA_EVIDENCE_HMAC_KEY: ci-evidence-hmac-key-at-least-thirty-two-bytes
      AMAURA_SANDBOX_MODE: docker
      AMAURA_DISABLE_CLOUD: "1"
      JARVIS_LEGACY_TOOL_MODE: disabled
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install frozen environment
        run: |
          python -m pip install --upgrade pip uv
          PYTHONWARNINGS=default uv sync --frozen --extra dev --python python
      - name: Compile all Python sources
        run: .venv/bin/python -m compileall -q jarvis aimodel scripts tests
      - name: Isolated full regression suite
        run: PYTHONWARNINGS=error .venv/bin/python scripts/run_verified_tests.py --timeout 300
      - name: Lint
        run: .venv/bin/ruff check jarvis scripts tests
      - name: Types
        run: .venv/bin/mypy jarvis/amaura jarvis/tools/amaura.py jarvis/server.py
      - name: Static source gate
        run: PYTHONWARNINGS=error .venv/bin/python scripts/release_gate.py --static-only
      - name: Acquisition adversarial stress
        run: PYTHONWARNINGS=error .venv/bin/python scripts/stress_amaura.py
      - name: Trust and concurrency stress
        run: PYTHONWARNINGS=error .venv/bin/python scripts/stress_trust_foundation.py
      - name: Clean release build and wheel smoke
        if: matrix.python-version == '3.11'
        run: .venv/bin/python scripts/build_release.py --output release-ci
      - name: Installer-based wheel qualification
        if: matrix.python-version == '3.11'
        run: |
          wheel=$(find release-ci -maxdepth 1 -type f -name 'jarvis-*.whl' -print -quit)
          test -n "$wheel"
          .venv/bin/python scripts/verify_installed_wheel.py "$wheel"
      - name: Desktop secure-build contract
        if: matrix.python-version == '3.11'
        run: |
          npm --prefix desktop-app ci --ignore-scripts --no-audit --no-fund
          node --check desktop-app/main.js
          .venv/bin/python -m py_compile scripts/build_desktop_backend.py scripts/build_desktop_app.py
          test -f desktop-app/renderer/hud.css
          test -f desktop-app/renderer/hud.js
          test -f desktop-app/assets/icon.png
          test -f desktop-app/assets/icon.icns
          test -f desktop-app/entitlements.plist
          test -f desktop-app/package-lock.json
