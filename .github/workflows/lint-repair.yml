name: lint-repair

on:
  push:
    branches:
      - agent/phase9-semantic-repair

permissions:
  contents: write

defaults:
  run:
    working-directory: Amaura-JARVIS-v5.4

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen environment
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen --extra dev --python python
      - name: Apply confirmed lint repairs
        run: |
          set -euo pipefail
          .venv/bin/ruff check --fix --unsafe-fixes jarvis tests/test_phase9_semantic_hardening.py scripts/*.py || true
          python - <<'PY'
          from pathlib import Path

          p = Path('jarvis/amaura/cognition.py')
          text = p.read_text()
          if 'from pathlib import Path\n' not in text:
              text = text.replace('from datetime import UTC, datetime\n', 'from datetime import UTC, datetime\nfrom pathlib import Path\n', 1)
          p.write_text(text)

          p = Path('jarvis/amaura/capability_runtime.py')
          text = p.read_text()
          if '\nimport re\n' not in text.split('from dataclasses', 1)[0]:
              text = text.replace('import os\n', 'import os\nimport re\n', 1)
          lines = text.splitlines(keepends=True)
          seen_re = False
          cleaned = []
          for source_line in lines:
              if source_line.strip() == 'import re' and not source_line.startswith((' ', '\t')):
                  if seen_re:
                      continue
                  seen_re = True
              cleaned.append(source_line)
          text = ''.join(cleaned)
          text = text.replace("        except subprocess.TimeoutExpired:\n            raise CapabilityExecutionError(f\"Command timed out for application '{raw_app_name}'.\")\n", "        except subprocess.TimeoutExpired:\n            raise CapabilityExecutionError(f\"Command timed out for application '{raw_app_name}'.\") from None\n", 1)
          text = text.replace("        except Exception as e:\n            raise CapabilityExecutionError(f\"Execution error for application '{raw_app_name}': {e}\")\n", "        except Exception as e:\n            raise CapabilityExecutionError(f\"Execution error for application '{raw_app_name}': {e}\") from e\n", 1)
          text = text.replace('                    raise CapabilityExecutionError(\n                        "Another heavy Amaura capability is already running; retry after it completes"\n                    )\n', '                    raise CapabilityExecutionError(\n                        "Another heavy Amaura capability is already running; retry after it completes"\n                    ) from None\n', 1)
          p.write_text(text)

          p = Path('jarvis/amaura/antigravity_bridge.py')
          text = p.read_text().replace('                digest.update(relative.encode()); digest.update(path.read_bytes())', '                digest.update(relative.encode())\n                digest.update(path.read_bytes())', 1)
          text = text.replace('                out_thread.start(); err_thread.start()', '                out_thread.start()\n                err_thread.start()', 1)
          text = text.replace('                out_thread.join(timeout=2); err_thread.join(timeout=2)', '                out_thread.join(timeout=2)\n                err_thread.join(timeout=2)', 1)
          p.write_text(text)

          p = Path('jarvis/amaura/direct_action.py')
          text = p.read_text().replace('def _helper_return_operator(helper_name: str) -> str:', 'def _helper_return_operator(helper_name: str, tree: ast.AST = tree) -> str:', 1)
          text = text.replace('lines = [l for l in input_1.splitlines() if l.strip()]', 'lines = [line for line in input_1.splitlines() if line.strip()]', 1)
          text = text.replace('re.match(r"^[a-zA-Z0-9_.\\-]+\\s*[:=]\\s*", l.strip()) for l in lines if not l.strip().startswith("#")', 're.match(r"^[a-zA-Z0-9_.\\-]+\\s*[:=]\\s*", line.strip()) for line in lines if not line.strip().startswith("#")', 1)
          text = text.replace('not any("|" in l or "\\t" in l or "," in l for l in lines)', 'not any("|" in line or "\\t" in line or "," in line for line in lines)', 1)
          text = text.replace('clean_lines = [l for l in input_1.splitlines() if l.strip() and not l.strip().startswith("#") and not re.match(r"^[-|+= :]+$", l.strip())]', 'clean_lines = [line for line in input_1.splitlines() if line.strip() and not line.strip().startswith("#") and not re.match(r"^[-|+= :]+$", line.strip())]', 1)
          text = text.replace('lines = [l for l in input_1.splitlines() if l.strip() and not l.strip().startswith("#")]', 'lines = [line for line in input_1.splitlines() if line.strip() and not line.strip().startswith("#")]', 1)
          text = text.replace('                for l in lines:\n                    m = re.match(r"^\\s*([a-zA-Z0-9_.\\-]+)\\s*[:=]\\s*(.*)$", l)', '                for line in lines:\n                    m = re.match(r"^\\s*([a-zA-Z0-9_.\\-]+)\\s*[:=]\\s*(.*)$", line)', 1)
          p.write_text(text)

          p = Path('jarvis/amaura/content_factory.py')
          text = p.read_text().replace('            raise GovernanceError(f"Invalid campaign schema: {exc}")', '            raise GovernanceError(f"Invalid campaign schema: {exc}") from exc', 1)
          text = text.replace('            raise GovernanceError(f"Invalid asset schema: {exc}")', '            raise GovernanceError(f"Invalid asset schema: {exc}") from exc', 1)
          p.write_text(text)

          p = Path('jarvis/amaura/model_gateway.py')
          lines = p.read_text().splitlines(keepends=True)
          marker = next(i for i, line in enumerate(lines) if 'Executive cognition gateway' in line)
          first_class = next(i for i in range(marker, len(lines)) if lines[i].startswith('@_dataclass'))
          late = []
          kept = []
          for i, line in enumerate(lines):
              if marker < i < first_class and (line.startswith('import ') or line.startswith('from ')):
                  late.append(line)
              else:
                  kept.append(line)
          if late:
              insert_at = next(i for i, line in enumerate(kept) if line.startswith('from dataclasses import asdict'))
              kept[insert_at:insert_at] = late
          text = ''.join(kept)
          text = text.replace('        except Exception:\n            if chunks:\n                raise GovernanceError("OmniRoute stream interrupted after output began")\n', '        except Exception as exc:\n            if chunks:\n                raise GovernanceError("OmniRoute stream interrupted after output began") from exc\n', 1)
          p.write_text(text)

          p = Path('jarvis/amaura/gitops.py')
          p.write_text(p.read_text().replace('                    raise GovernanceError("Timed out waiting for the repository merge lock")', '                    raise GovernanceError("Timed out waiting for the repository merge lock") from None', 1))

          p = Path('jarvis/amaura/readiness.py')
          text = p.read_text()
          needle = '    balanced_worker_key = bool(\n        nvidia_worker_key or os.environ.get("GROQ_API_KEY", "").strip()\n    )\n'
          replacement = needle + '    cloud_worker_key = balanced_worker_key if model_mode == "balanced" else nvidia_worker_key\n'
          if 'cloud_worker_key =' not in text:
              text = text.replace(needle, replacement, 1)
          p.write_text(text)

          p = Path('jarvis/amaura/prompts/__init__.py')
          lines = p.read_text().splitlines(keepends=True)
          p.write_text(''.join(line for line in lines if line.strip() != 'import os'))

          p = Path('jarvis/fable_engine.py')
          text = p.read_text()
          text = text.replace(
              'relevant_lines = [l for l in lines if any(k in l.lower() for k in ["error", "exception", "failed", "assert", "traceback"])]',
              'relevant_lines = [line for line in lines if any(keyword in line.lower() for keyword in ["error", "exception", "failed", "assert", "traceback"])]',
              1,
          )
          p.write_text(text)

          p = Path('jarvis/cli.py')
          text = p.read_text()
          if 'from typing import TYPE_CHECKING\n' not in text:
              text = text.replace('import sys\n', 'import sys\nfrom typing import TYPE_CHECKING\n', 1)
          if 'if TYPE_CHECKING:' not in text:
              anchor = 'from jarvis import ui\n'
              block = '\nif TYPE_CHECKING:\n    from jarvis.agent import JarvisAgent\n    from jarvis.voice.engine import VoiceEngine\n'
              text = text.replace(anchor, anchor + block, 1)
          p.write_text(text)

          p = Path('jarvis/amaura/store_api.py')
          text = p.read_text()
          text = text.replace('from typing import Protocol, Any, ContextManager\n', 'from contextlib import AbstractContextManager\nfrom typing import Any, Protocol\n', 1)
          text = text.replace('ContextManager[Any]', 'AbstractContextManager[Any]')
          p.write_text(text)
          PY
          # Custom repairs can introduce import-order or other auto-fixable issues;
          # run Ruff once more before the strict no-fix gate.
          .venv/bin/ruff check --fix --unsafe-fixes jarvis tests/test_phase9_semantic_hardening.py scripts/*.py || true
      - name: Enforce clean lint
        run: .venv/bin/ruff check --output-format=github jarvis tests/test_phase9_semantic_hardening.py scripts/*.py
      - name: Compile after lint repair
        run: .venv/bin/python -m compileall -q jarvis
      - name: Commit lint repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jarvis
          if git diff --cached --quiet; then
            echo "No lint changes required."
          else
            git commit -m "fix: satisfy release lint gate"
            git push origin HEAD:agent/phase9-semantic-repair
          fi
