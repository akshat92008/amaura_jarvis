name: lint-repair

on:
  push:
    branches:
      - agent/phase9-semantic-repair

permissions:
  contents: write

defaults:
  run:
    working-directory: Amaura-JARVIS-v5.4

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen environment
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen --extra dev --python python
      - name: Apply confirmed lint repairs
        run: |
          set -euo pipefail
          .venv/bin/ruff check --fix --unsafe-fixes jarvis tests/test_phase9_semantic_hardening.py scripts/*.py || true
          python - <<'PY'
          from pathlib import Path

          # cognition.py: Path is used by semantic execution helpers but was not imported.
          p = Path('jarvis/amaura/cognition.py')
          text = p.read_text()
          if 'from pathlib import Path\n' not in text:
              text = text.replace('from datetime import UTC, datetime\n', 'from datetime import UTC, datetime\nfrom pathlib import Path\n', 1)
          p.write_text(text)

          # capability_runtime.py: keep re at module scope and make exception chaining explicit.
          p = Path('jarvis/amaura/capability_runtime.py')
          text = p.read_text()
          if '\nimport re\n' not in text.split('from dataclasses', 1)[0]:
              text = text.replace('import os\n', 'import os\nimport re\n', 1)
          text = text.replace('\nimport re\n\nclass MacOSAppAdapter', '\n\nclass MacOSAppAdapter', 1)
          text = text.replace(
              "        except subprocess.TimeoutExpired:\n            raise CapabilityExecutionError(f\"Command timed out for application '{raw_app_name}'.\")\n",
              "        except subprocess.TimeoutExpired:\n            raise CapabilityExecutionError(f\"Command timed out for application '{raw_app_name}'.\") from None\n",
              1,
          )
          text = text.replace(
              "        except Exception as e:\n            raise CapabilityExecutionError(f\"Execution error for application '{raw_app_name}': {e}\")\n",
              "        except Exception as e:\n            raise CapabilityExecutionError(f\"Execution error for application '{raw_app_name}': {e}\") from e\n",
              1,
          )
          text = text.replace(
              '                    raise CapabilityExecutionError(\n                        "Another heavy Amaura capability is already running; retry after it completes"\n                    )\n',
              '                    raise CapabilityExecutionError(\n                        "Another heavy Amaura capability is already running; retry after it completes"\n                    ) from None\n',
              1,
          )
          p.write_text(text)

          # antigravity_bridge.py: split the three flagged semicolon statements.
          p = Path('jarvis/amaura/antigravity_bridge.py')
          text = p.read_text()
          text = text.replace(
              '                digest.update(relative.encode()); digest.update(path.read_bytes())',
              '                digest.update(relative.encode())\n                digest.update(path.read_bytes())',
              1,
          )
          text = text.replace(
              '                out_thread.start(); err_thread.start()',
              '                out_thread.start()\n                err_thread.start()',
              1,
          )
          text = text.replace(
              '                out_thread.join(timeout=2); err_thread.join(timeout=2)',
              '                out_thread.join(timeout=2)\n                err_thread.join(timeout=2)',
              1,
          )
          p.write_text(text)
          PY
      - name: Enforce clean lint
        run: .venv/bin/ruff check --output-format=github jarvis tests/test_phase9_semantic_hardening.py scripts/*.py
      - name: Compile after lint repair
        run: .venv/bin/python -m compileall -q jarvis
      - name: Commit lint repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jarvis/agent.py jarvis/amaura/cognition.py jarvis/amaura/capability_runtime.py jarvis/amaura/antigravity_bridge.py jarvis/amaura/direct_action.py jarvis/amaura/semantic_core.py
          if git diff --cached --quiet; then
            echo "No lint changes required."
          else
            git commit -m "fix: satisfy release lint gate"
            git push origin HEAD:agent/phase9-semantic-repair
          fi
