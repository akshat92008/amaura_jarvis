name: lint-repair

on:
  push:
    branches:
      - agent/phase9-semantic-repair

permissions:
  contents: write

defaults:
  run:
    working-directory: Amaura-JARVIS-v5.4

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen environment
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen --extra dev --python python
      - name: Apply deterministic lint repair
        run: |
          set -euo pipefail
          .venv/bin/ruff check --fix --unsafe-fixes jarvis tests/test_phase9_semantic_hardening.py || true
          .venv/bin/python scripts/lint_repair_apply.py
          .venv/bin/python scripts/lint_repair_finalize.py
          .venv/bin/ruff format \
            scripts/arch_holdout_v*.py \
            scripts/qual_bb_master.py \
            scripts/qual_bb_harness.py \
            scripts/qual_bb_phase00.py \
            scripts/qual_harness_selftest.py
          .venv/bin/ruff check --fix --select UP045,UP012 scripts/arch_holdout_v*.py
          .venv/bin/ruff check --fix --unsafe-fixes jarvis tests/test_phase9_semantic_hardening.py || true
      - name: Enforce clean lint
        run: .venv/bin/ruff check --output-format=github jarvis tests/test_phase9_semantic_hardening.py scripts/*.py
      - name: Compile after lint repair
        run: .venv/bin/python -m compileall -q jarvis scripts
      - name: Commit lint repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            jarvis \
            scripts/arch_holdout_v*.py \
            scripts/qual_bb_master.py \
            scripts/qual_bb_harness.py \
            scripts/qual_bb_phase00.py \
            scripts/qual_harness_selftest.py
          if git diff --cached --quiet; then
            echo "No lint changes required."
          else
            git commit -m "fix: satisfy release lint gate"
            git push origin HEAD:agent/phase9-semantic-repair
          fi
