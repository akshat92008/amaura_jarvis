name: lint-repair

on:
  push:
    branches:
      - agent/phase9-semantic-repair

permissions:
  contents: write

defaults:
  run:
    working-directory: Amaura-JARVIS-v5.4

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen environment
        run: |
          python -m pip install --upgrade pip uv
          uv sync --frozen --extra dev --python python
      - name: Apply mechanical lint repairs
        run: |
          set -euo pipefail
          .venv/bin/ruff check --fix --unsafe-fixes jarvis tests/test_phase9_semantic_hardening.py scripts/*.py || true
          python - <<'PY'
          from pathlib import Path
          p = Path('jarvis/amaura/direct_action.py')
          source_lines = p.read_text().splitlines(keepends=True)
          repaired = []
          for source_line in source_lines:
              if source_line.strip() == 'content_str = result.output':
                  continue
              if 'all(re.match(r"^[a-zA-Z0-9_.\\-]+\\s*[:=]\\s*", l) for l in clean_lines)' in source_line:
                  source_line = source_line.replace(
                      'all(re.match(r"^[a-zA-Z0-9_.\\-]+\\s*[:=]\\s*", l) for l in clean_lines)',
                      'all(re.match(r"^[a-zA-Z0-9_.\\-]+\\s*[:=]\\s*", line) for line in clean_lines)',
                  )
              repaired.append(source_line)
          p.write_text(''.join(repaired))
          PY
      - name: Enforce clean lint
        run: .venv/bin/ruff check --output-format=github jarvis tests/test_phase9_semantic_hardening.py scripts/*.py
      - name: Compile after lint repair
        run: .venv/bin/python -m compileall -q jarvis
      - name: Commit lint repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jarvis/agent.py jarvis/amaura/direct_action.py jarvis/amaura/semantic_core.py
          if git diff --cached --quiet; then
            echo "No lint changes required."
          else
            git commit -m "fix: satisfy release lint gate"
            git push origin HEAD:agent/phase9-semantic-repair
          fi
