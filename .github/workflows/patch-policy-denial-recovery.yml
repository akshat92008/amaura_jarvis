name: patch-policy-denial-recovery

on:
  push:
    branches:
      - fix/bounded-cloud-turns

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/bounded-cloud-turns
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Patch governed runner denial recovery
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Amaura-JARVIS-v5.4/jarvis/amaura/executor.py')
          text = path.read_text()

          import_anchor = 'from jarvis.amaura.security import redact_sensitive_text\n'
          import_line = 'from jarvis.amaura.tool_authorization import authorization_denial_result\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('executor import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          old = '''                    self.control.authorize_tool(task_id, employee.agent_id, call.function.name, scoped_args)\n                    result = self._execute_tool(\n                        call.function.name,\n                        scoped_args,\n                        execute_tool,\n                        sandbox=sandbox,\n                        workspace=workspace,\n                    )\n'''
          new = '''                    denied_result = authorization_denial_result(\n                        self.control,\n                        task_id=task_id,\n                        agent_id=employee.agent_id,\n                        tool_name=call.function.name,\n                        args=scoped_args,\n                    )\n                    if denied_result is not None:\n                        result = denied_result\n                    else:\n                        result = self._execute_tool(\n                            call.function.name,\n                            scoped_args,\n                            execute_tool,\n                            sandbox=sandbox,\n                            workspace=workspace,\n                        )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('executor authorization block not found')

          path.write_text(text)
          PY
      - name: Run focused regression tests
        working-directory: Amaura-JARVIS-v5.4
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_amaura_policy_denial_recovery.py tests/test_nvidia_latency_budget.py tests/test_bounded_web_search.py
          python -m py_compile jarvis/amaura/executor.py jarvis/amaura/tool_authorization.py jarvis/api.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Amaura-JARVIS-v5.4/jarvis/amaura/executor.py
          git commit -m 'fix(amaura): recover from denied worker tool requests'
          git push origin HEAD:fix/bounded-cloud-turns
