name: v10-repair-validation

on:
  push:
    branches:
      - agent/phase9-semantic-repair

permissions:
  contents: write

defaults:
  run:
    working-directory: Amaura-JARVIS-v5.4

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      AMAURA_MODEL_MODE: local
      AMAURA_LOCAL_MODEL: nova-worker-test
      AMAURA_LOCAL_REVIEW_MODEL: nova-reviewer-test
      AMAURA_REVIEWER_KEYS: qa-reviewer:ci-reviewer-key-at-least-thirty-two-bytes
      AMAURA_REVIEW_ATTESTATION_KEY: ci-review-attestation-key-at-least-thirty-two-bytes
      AMAURA_PROVIDER_RECEIPT_KEY: ci-provider-receipt-key-at-least-thirty-two-bytes
      AMAURA_AUDIT_HMAC_KEY: ci-audit-hmac-key-at-least-thirty-two-bytes
      AMAURA_EVIDENCE_HMAC_KEY: ci-evidence-hmac-key-at-least-thirty-two-bytes
      AMAURA_SANDBOX_MODE: docker
      AMAURA_DISABLE_CLOUD: '1'
      JARVIS_LEGACY_TOOL_MODE: disabled
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install frozen environment
        run: |
          python -m pip install --upgrade pip uv
          PYTHONWARNINGS=default uv sync --frozen --extra dev --python python
      - name: Apply staged semantic repair
        run: |
          set -euo pipefail
          for patch in \
            scripts/v10_repair_semantic_frontend.patch \
            scripts/v10_repair_memory_grammar.patch \
            scripts/v10_repair_direct_action.patch \
            scripts/v10_repair_semantic_core.patch
          do
            if git apply --check "$patch"; then
              git apply "$patch"
            elif git apply --reverse --check "$patch"; then
              echo "$patch already applied"
            else
              echo "Patch does not apply cleanly: $patch" >&2
              exit 2
            fi
          done
      - name: Compile repaired sources
        run: .venv/bin/python -m compileall -q jarvis
      - name: Focused semantic compatibility gate
        run: |
          env -u PYTEST_DISABLE_PLUGIN_AUTOLOAD .venv/bin/python -m pytest -q \
            tests/test_generic_execution_repair.py \
            tests/test_intent_routing.py \
            tests/test_phase4_execution_semantics.py \
            tests/test_phase5_2_grammar_closure.py \
            tests/test_phase5_writes_and_failure_injection.py \
            tests/test_phase6_arch_repairs.py \
            tests/test_phase7_exact_response_property.py \
            tests/test_phase7_failure_injection.py \
            tests/test_phase7_invariants_and_regression.py \
            tests/test_phase8_semantic_composition.py \
            tests/test_phase9_compatibility_gate.py \
            tests/test_phase9_semantic_hardening.py \
            tests/test_phase9_semantic_request_graph.py
      - name: Full maintained regression
        run: PYTHONWARNINGS=error .venv/bin/python scripts/run_verified_tests.py --timeout 300

  commit-repair:
    needs: validate
    if: ${{ success() && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply validated repair
        working-directory: Amaura-JARVIS-v5.4
        run: |
          set -euo pipefail
          for patch in \
            scripts/v10_repair_semantic_frontend.patch \
            scripts/v10_repair_memory_grammar.patch \
            scripts/v10_repair_direct_action.patch \
            scripts/v10_repair_semantic_core.patch
          do
            if git apply --check "$patch"; then
              git apply "$patch"
            elif git apply --reverse --check "$patch"; then
              echo "$patch already applied"
            else
              echo "Patch does not apply cleanly: $patch" >&2
              exit 2
            fi
          done
      - name: Commit production repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jarvis/amaura/semantic_frontend.py \
                  jarvis/amaura/direct_action.py \
                  jarvis/amaura/semantic_core.py
          if git diff --cached --quiet; then
            echo "No production source changes to commit."
          else
            git commit -m "fix: close fresh holdout semantic generalization gaps"
            git push origin HEAD:agent/phase9-semantic-repair
          fi
