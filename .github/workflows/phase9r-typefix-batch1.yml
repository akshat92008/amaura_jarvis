name: phase9r-typefix-batch1

on:
  push:
    branches: [agent/phase9-semantic-repair]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/phase9-semantic-repair
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply type-safety root-cause fixes
        shell: bash
        run: |
          cd Amaura-JARVIS-v5.4
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          p = Path('jarvis/amaura/database.py')
          text = p.read_text()
          text = text.replace('from sqlalchemy.orm import declarative_base, sessionmaker', 'from sqlalchemy.orm import DeclarativeBase, sessionmaker')
          text = text.replace('Base = declarative_base()\n', 'class Base(DeclarativeBase):\n    pass\n')
          p.write_text(text)

          p = Path('jarvis/amaura/prompts/__init__.py')
          replace_once(p, '    catalogue = {}\n', '    catalogue: dict[str, str] = {}\n')

          p = Path('jarvis/amaura/cognition.py')
          text = p.read_text()
          if 'import builtins\n' not in text:
              text = text.replace('import contextvars\n', 'import builtins\nimport contextvars\n', 1)
          start = text.index('class UnifiedMemoryService:')
          end = text.index('\nclass MemoryConsolidator:', start)
          block = text[start:end]
          block = re.sub(r'(?<![\w.])list\[', 'builtins.list[', block)
          text = text[:start] + block + text[end:]
          p.write_text(text)

          p = Path('jarvis/amaura/semantic_core.py')
          text = p.read_text()
          text = text.replace(
              '    browser: BrowserPlan | None = None\n    errors: list[str] = field(default_factory=list)\n',
              '    browser: BrowserPlan | None = None\n    transform_plan: dict[str, Any] | None = None\n    errors: list[str] = field(default_factory=list)\n',
              1,
          )
          text = text.replace(
              '        value: Any = next(iter(fields.values())) if len(fields) == 1 else fields\n',
              '        browser_value: Any = next(iter(fields.values())) if len(fields) == 1 else fields\n',
              1,
          )
          text = text.replace('                "value": value,\n', '                "value": browser_value,\n', 1)
          text = text.replace(
              '                    return _eval_expr(child.value, env, functions, overrides, depth + 1), env\n',
              '                    return (\n                        _eval_expr(child.value, env, functions, overrides, depth + 1)\n                        if child.value is not None\n                        else None\n                    ), env\n',
              1,
          )
          text = text.replace(
              '            return _eval_expr(stmt.value, env, functions, overrides, depth + 1), env\n',
              '            return (\n                _eval_expr(stmt.value, env, functions, overrides, depth + 1) if stmt.value is not None else None\n            ), env\n',
              1,
          )
          text = text.replace(
              '    from jarvis.amaura import direct_action as da\n\n    original_execute_tool = da.execute_tool\n',
              '    from jarvis.amaura import direct_action as da\n    from jarvis.amaura.models import GovernanceError\n\n    original_execute_tool = da.execute_tool\n',
              1,
          )
          text = text.replace('raise da.GovernanceError(', 'raise GovernanceError(')
          p.write_text(text)

          p = Path('jarvis/amaura/semantic_frontend.py')
          text = p.read_text()
          text = text.replace(
              '    def unified_extract(text: str, extensions: tuple[str, ...]) -> list[str]:\n        return _normalized_paths(base_extract, text, extensions)\n',
              '    def unified_extract(text: str, known_extensions: tuple[str, ...]) -> list[str]:\n        return _normalized_paths(base_extract, text, known_extensions)\n',
              1,
          )
          text = text.replace(
              '        value: Any = next(iter(successful.values())) if len(successful) == 1 else successful\n',
              '        browser_value: Any = next(iter(successful.values())) if len(successful) == 1 else successful\n',
              1,
          )
          text = text.replace('                "value": value,\n', '                "value": browser_value,\n', 1)
          p.write_text(text)

          for p in sorted(Path('jarvis/amaura').glob('semantic*.py')):
              text = p.read_text()
              if 'def _install_attr(obj: Any, name: str, value: Any) -> None:' not in text:
                  marker = '_INSTALLED = False\n'
                  if marker in text:
                      text = text.replace(
                          marker,
                          marker + '\n\ndef _install_attr(obj: Any, name: str, value: Any) -> None:\n    setattr(obj, name, value)\n',
                          1,
                      )
              text = re.sub(
                  r'(?m)^(\s*)([A-Za-z_][\w.]*?)\.([A-Za-z_]\w*)\s*=\s*classmethod\(([A-Za-z_]\w*)\)\s*$',
                  lambda m: f'{m.group(1)}_install_attr({m.group(2)}, "{m.group(3)}", classmethod({m.group(4)}))',
                  text,
              )
              text = text.replace(
                  'cls._is_repository_inspection_request = classmethod(lambda _cls, _text: True)',
                  '_install_attr(cls, "_is_repository_inspection_request", classmethod(lambda _cls, _text: True))',
              )
              text = text.replace(
                  'cls._is_repository_inspection_request = original_descriptor',
                  '_install_attr(cls, "_is_repository_inspection_request", original_descriptor)',
              )
              text = re.sub(
                  r'([A-Za-z_][\w.]*\.[A-Za-z_]\w*)\.__func__',
                  lambda m: f'getattr({m.group(1)}, "__func__", {m.group(1)})',
                  text,
              )
              p.write_text(text)
          PY

          python -m pip install --upgrade pip uv
          uv sync --frozen --extra dev --python python
          .venv/bin/ruff format jarvis/amaura/database.py jarvis/amaura/prompts/__init__.py jarvis/amaura/cognition.py jarvis/amaura/semantic_core.py jarvis/amaura/semantic_frontend.py jarvis/amaura/semantic_*.py
          .venv/bin/ruff check jarvis scripts tests
          .venv/bin/python -m compileall -q jarvis aimodel scripts tests
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 .venv/bin/python -m pytest -q tests/test_phase9r_checkpoint_rollback.py tests/test_phase8_semantic_composition.py tests/test_phase8_api_boundary.py
          .venv/bin/mypy jarvis/amaura jarvis/tools/amaura.py jarvis/server.py || true

          cd ..
          rm .github/workflows/phase9r-typefix-batch1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(phase9r): resolve semantic and memory typing roots"
          git push origin HEAD:agent/phase9-semantic-repair
